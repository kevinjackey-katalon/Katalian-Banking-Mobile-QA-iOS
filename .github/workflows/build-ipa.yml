name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KatalianBankingMobileQA.xcodeproj \
            -scheme KatalianBankingMobileQA \
            -configuration Release \
            -archivePath build/KatalianBankingMobileQA.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/KatalianBankingMobileQA.xcarchive/Products/Applications/Katalian Banking - iOS.app"
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" "ipa_root/Payload/"
          cd ipa_root && zip -r -X "../Katalian Banking - iOS.ipa" Payload && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Katalian Banking - iOS
          path: "Katalian Banking - iOS.ipa"
