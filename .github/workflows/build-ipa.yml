name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KatalianBankingMobileQA.xcodeproj \
            -scheme KatalianBankingMobileQA \
            -configuration Release \
            -archivePath build/KatalianBankingMobileQA.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/KatalianBankingMobileQA.xcarchive/Products/Applications/Katalian Banking.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: expected app bundle not found at: $APP_PATH"
            echo "Actual contents of Products/Applications:"
            ls -la "build/KatalianBankingMobileQA.xcarchive/Products/Applications/" || true
            exit 1
          fi
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" "ipa_root/Payload/"
          cd ipa_root
          zip -r -X "../Katalian Banking.ipa" Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: Katalian Banking
          path: "Katalian Banking.ipa"
          if-no-files-found: error
