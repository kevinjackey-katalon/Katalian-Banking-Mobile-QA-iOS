name: KatalianBankingMobileQA
options:
  bundleIdPrefix: com.katalon.katalianbanking
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  KatalianBankingMobileQA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Katalian Banking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.katalon.katalianbanking.mobileqa
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
schemes:
  KatalianBankingMobileQA:
    build:
      targets:
        KatalianBankingMobileQA: all
    run:
      config: Debug
    archive:
      config: Release
